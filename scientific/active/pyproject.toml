[project]
name = "mass-spinner-science"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
  "numpy==2.5.5", "scipy==1.18.1", "matplotlib==3.11.2",
  "snakemake==9.27.2", "ruff==0.17.5", "jsonschema==4.26.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
