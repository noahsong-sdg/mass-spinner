name: Verify
on: [push, pull_request]
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare isolated tools and locked dependencies
        run: |
          docker build -t mass-spinner-check -f ci/Dockerfile .
          docker image inspect mass-spinner-check --format '{{.Id}}'
          docker run --rm --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp mass-spinner-check npm ci --ignore-scripts --no-audit --no-fund
          docker run --rm --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp mass-spinner-check sh -c 'npm audit --json > npm-audit.json; code=$?; test "$code" -le 1'
      - name: Test and build offline
        run: |
          docker run --rm --network none --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp --env OPENBLAS_NUM_THREADS=1 --env OMP_NUM_THREADS=1 --env MKL_NUM_THREADS=1 mass-spinner-check sh -eu -c '
            node --import tsx scripts/check-dependencies.ts npm-audit.json
            npm run typecheck
            npm run typecheck:infrastructure
            npm run typecheck:boundaries
            npm run typecheck:tests
            npm run lint
            python3 -m unittest discover -s scientific/electron-applicability -p test_screen.py -v
            python3 -m unittest discover -s tests -p test_argon_reference_export.py -v
            node --import tsx --test --test-concurrency=1 tests/*.test.ts
            npm run build
            cp output/equilibrium-qualification.json release/equilibrium-qualification.json
            npm run check:site
            npm run check:assets
            npm run check:gltf
            npm run release:seal
            npm run release:verify
          '
      - name: Save candidate site for browser verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-site
          path: release/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  browser:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-site
          path: release/
      - name: Prepare isolated Chromium and locked dependencies
        run: |
          docker build -t mass-spinner-browser -f ci/Dockerfile.browser .
          docker image inspect mass-spinner-browser --format '{{.Id}}'
          docker run --rm --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e HOME=/tmp mass-spinner-browser npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact candidate in Chromium desktop and phone layouts
        run: |
          # SwiftShader and the physics worker share the runner's four CPUs.
          docker run --rm --network none --memory 2g --cpus 4 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e HOME=/tmp mass-spinner-browser sh -eu -c '
            npm run release:verify
            status=0
            npm run test:browser || status=$?
            mkdir -p test-results
            awk '\''{print FILENAME ": " $0}'\'' /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.events /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu.stat > test-results/container-resources.txt
            test "$status" -eq 0
            npm run release:verify
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Save browser-verified site for deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-site
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
