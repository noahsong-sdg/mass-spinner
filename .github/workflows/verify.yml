name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare isolated tools and locked dependencies
        run: |
          docker build -t mass-spinner-check -f ci/Dockerfile .
          docker image inspect mass-spinner-check --format '{{.Id}}'
          docker run --rm --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp mass-spinner-check npm ci --ignore-scripts --no-audit --no-fund
          docker run --rm --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp mass-spinner-check sh -c 'npm audit --json > npm-audit.json; code=$?; test "$code" -le 1'
      - name: Test and build offline
        run: |
          docker run --rm --network none --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp --env OPENBLAS_NUM_THREADS=1 --env OMP_NUM_THREADS=1 --env MKL_NUM_THREADS=1 mass-spinner-check sh -eu -c '
            node --import tsx scripts/check-dependencies.ts npm-audit.json
            npm run typecheck
            npm run typecheck:infrastructure
            npm run lint
            node --import tsx --test --test-concurrency=1 tests/scenario-state-v38.test.ts tests/experiment-sharing.test.ts tests/fuel-centrifuge-scenario-v44.test.ts tests/baseline-capture-v38.test.ts tests/hydrogen-scenario-v38.test.ts tests/finite-film-scenario-v38.test.ts tests/collector-ui-v38.test.ts
            node --import tsx --test --test-concurrency=1 tests/audit-spatial-ui-v53.test.ts tests/fuel-operation-ui-v51.test.ts tests/experiment-sharing.test.ts tests/scenario-state-v38.test.ts tests/experience.test.ts tests/fuel-assembly-load.test.ts tests/legacy-render-loading.test.ts tests/identity-renderer-v43.test.ts tests/playground-audit.test.ts tests/fusion-inspector-main-v43.test.ts tests/release-links.test.ts tests/qualification-page.test.ts
            node --import tsx --test --test-concurrency=1 tests/fuel-equilibrium.test.ts tests/fuel-equilibrium-ui.test.ts
            node --import tsx --test --test-concurrency=1 tests/understanding-page.test.ts tests/understanding-guide.test.ts tests/playground-guide.test.ts tests/fuel-playground-integration-v47.test.ts tests/fuel-centrifuge-ui-v44.test.ts
            node --import tsx --test --test-concurrency=1 tests/experimental-validation.test.ts tests/fuel-recovery-domain.test.ts tests/argon-reference.test.ts tests/argon-reference-ui.test.ts
            node --import tsx --test --test-concurrency=1 tests/fuel-spatial-experiment.test.ts tests/fuel-spatial-experiment-ui.test.ts tests/fuel-worker-v47.test.ts tests/worker-client.test.ts
            python3 -m unittest discover -s scientific/electron-applicability -p test_screen.py -v
            python3 -m unittest discover -s tests -p test_argon_reference_export.py -v
            node --import tsx --test --test-concurrency=1 tests/*.test.ts
            npm run build
            cp output/equilibrium-qualification.json release/equilibrium-qualification.json
            npm run check:site
            npm run check:assets
            npm run check:gltf
            npm run release:seal
            npm run release:verify
          '
      - name: Save candidate site for browser verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-site
          path: release/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  browser:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-site
          path: release/
      - name: Prepare isolated Chromium and locked dependencies
        run: |
          docker build -t mass-spinner-browser -f ci/Dockerfile.browser .
          docker image inspect mass-spinner-browser --format '{{.Id}}'
          docker run --rm --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e HOME=/tmp mass-spinner-browser npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact candidate in Chromium desktop and phone layouts
        run: |
          docker run --rm --network none --memory 2g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e HOME=/tmp mass-spinner-browser sh -eu -c '
            npm run release:verify
            npm run test:browser
            npm run release:verify
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Save browser-verified site for deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-site
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
