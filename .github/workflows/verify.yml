name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare isolated tools and locked dependencies
        run: |
          docker build -t mass-spinner-check - <<'DOCKERFILE'
          FROM node:22-bookworm
          RUN apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker image inspect mass-spinner-check --format '{{.Id}}'
          docker run --rm --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp mass-spinner-check npm ci --ignore-scripts --no-audit --no-fund
      - name: Test and build offline
        run: |
          docker run --rm --network none --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp --env OPENBLAS_NUM_THREADS=1 --env OMP_NUM_THREADS=1 --env MKL_NUM_THREADS=1 mass-spinner-check sh -eu -c '
            node --import tsx --test --test-concurrency=1 tests/experimental-validation.test.ts tests/fuel-recovery-domain.test.ts tests/argon-reference.test.ts tests/argon-reference-ui.test.ts
            python3 -m unittest discover -s scientific/electron-applicability -p test_screen.py -v
            python3 -m unittest discover -s tests -p test_argon_reference_export.py -v
            node --import tsx --test --test-concurrency=1 tests/*.test.ts
            npm run typecheck
            npm run build
            npm run check:site
            npm run check:assets
          '
