name: Mixture heat precision
on:
  push:
    branches: [codex/wall-heat-precision]
permissions:
  contents: read
jobs:
  precision:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare locked tools
        run: |
          docker build -t heat-check - <<'DOCKERFILE'
          FROM node:22-bookworm
          RUN apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker image inspect heat-check --format '{{.Id}}'
          docker run --rm --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp heat-check npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify heat precision offline
        run: |
          docker run --rm --network none --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp heat-check sh -eu -c '
            node --import tsx --test --test-concurrency=1 tests/fuel-gas-thermal.test.ts tests/fuel-spatial-operation-v66.test.ts
          '
