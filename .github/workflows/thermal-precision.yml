name: Mixture heat precision
on:
  push:
    branches: [codex/wall-heat-precision]
permissions:
  contents: read
jobs:
  precision:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare locked tools
        run: |
          docker build -t heat-check - <<'DOCKERFILE'
          FROM node:22-bookworm
          RUN apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker image inspect heat-check --format '{{.Id}}'
          docker run --rm --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp heat-check npm ci --ignore-scripts --no-audit --no-fund
      - name: Check heat and transport regressions offline
        run: |
          docker run --rm --network none --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp heat-check sh -eu -c '
            node --import tsx --test --test-concurrency=1 tests/fuel-gas.test.ts tests/fuel-gas-thermal.test.ts tests/fuel-spatial-operation-v66.test.ts
            node --import tsx --test --test-concurrency=1 tests/fuel-hotwall-continuation-v59.test.ts tests/fuel-mixture-operation-v58.test.ts tests/hotwall-adaptive-independent-v61.test.ts
          '
      - name: Compare independent precision references and coupled refinement offline
        run: |
          docker run --rm --network none --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp heat-check sh -eu -c '
            python3 scientific/spatial-argon-20261116/heat_precision_oracle.py --self-test
            python3 scientific/spatial-argon-20261116/sg_precision_oracle.py --self-test
            python3 scientific/spatial-argon-20261116/audit_nested.py --self-test
            study_status=0
            node --import tsx scripts/probe-fuel-heat-precision.ts heat-output || study_status=1
            python3 scientific/spatial-argon-20261116/heat_precision_oracle.py heat-output/heat-precision-input.json > heat-output/oracle-summary.log || study_status=1
            node --import tsx scripts/probe-fuel-sg-precision.ts heat-output || study_status=1
            python3 scientific/spatial-argon-20261116/sg_precision_oracle.py heat-output/sg-precision-input.json > heat-output/sg-oracle-summary.log || study_status=1
            node --import tsx scripts/probe-fuel-nested-coupling.ts nested-output || study_status=1
            python3 scientific/spatial-argon-20261116/audit_nested.py nested-output --source-root /work --output nested-output/independent-accounting.json || study_status=1
            exit "$study_status"
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: heat-precision
          path: |
            heat-output/
            nested-output/
          if-no-files-found: error
