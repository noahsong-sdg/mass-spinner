name: Radial transport precision
on:
  push:
    branches: [codex/radial-density]
permissions:
  contents: read
jobs:
  precision:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare locked tools
        run: |
          docker build -t radial-check - <<'DOCKERFILE'
          FROM node:22-bookworm
          RUN apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker image inspect radial-check --format '{{.Id}}'
          docker run --rm --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp radial-check npm ci --ignore-scripts --no-audit --no-fund
          mkdir radial-input
          tar -xzf scientific/spatial-argon-20261116/three-probes-93.tar.gz -C radial-input graded-output/histories.json
      - name: Replay and independently assess offline
        run: |
          docker run --rm --network none --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp radial-check sh -eu -c '
            python3 -m unittest discover -s scientific/spatial-argon-20261116 -p test_precision_oracle.py -v
            python3 scientific/spatial-argon-20261116/audit_source.py --self-test
            node --import tsx --test --test-concurrency=1 tests/fuel-gas.test.ts tests/fuel-spatial-convergence.test.ts
            node --import tsx scripts/probe-fuel-gas-precision.ts precision-output
            python3 scientific/spatial-argon-20261116/precision_oracle.py precision-output/precision-input.json
            source_status=0
            node --import tsx scripts/probe-fuel-radial-source.ts source-output || source_status=1
            python3 scientific/spatial-argon-20261116/audit_source.py source-output --source-root /work --output source-output/independent-accounting.json || source_status=1
            exit "$source_status"
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: radial-precision
          path: |
            precision-output/
            source-output/
          if-no-files-found: error
