name: Persistent liner heat
on:
  push:
    branches: [codex/liner-energy-storage,codex/liner-state-validation]
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare locked tools
        run: |
          docker build -t liner-check - <<'DOCKERFILE'
          FROM node:22-bookworm
          RUN apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker run --rm --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp liner-check npm ci --ignore-scripts --no-audit --no-fund
      - name: Check persistent storage and independent references offline
        run: |
          docker run --rm --network none --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp liner-check sh -eu -c '
            node --import tsx --test --test-concurrency=1 tests/fuel-spatial-operation-v66.test.ts tests/fuel-gas-thermal.test.ts tests/fuel-spatial-experiment.test.ts
            python3 scientific/spatial-argon-20261116/liner_storage_oracle.py --self-test
            python3 scientific/spatial-argon-20261116/audit_nested.py --self-test
            node --import tsx scripts/probe-fuel-liner-storage.ts liner-storage-output
            python3 scientific/spatial-argon-20261116/liner_storage_oracle.py liner-storage-output/liner-storage-input.json
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: liner-storage
          path: liner-storage-output/
          if-no-files-found: error
