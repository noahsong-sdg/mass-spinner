name: Active science environment
on:
  workflow_dispatch:
  push:
    branches: [codex/stack-modernization]
    paths: [scientific/active/**, ci/Dockerfile.science, .github/workflows/active-science.yml, schemas/**, scripts/export-thermal-toolchain.ts, src/fuel-thermal.ts, src/array-shape.ts, package-lock.json]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Resolve isolated scientific environment
        run: |
          docker build -t active-science -f ci/Dockerfile.science .
          docker run --rm --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e HOME=/tmp active-science npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p science-evidence
          docker image inspect active-science > science-evidence/container.json
          docker run --rm --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e HOME=/tmp active-science sh -eu -c '
            uv lock --check --project scientific/active
            uv sync --frozen --project scientific/active
          '
      - name: Lint, verify contracts and reproduce public diagnostic offline
        run: |
          mkdir -p science-evidence
          cp scientific/active/uv.lock science-evidence/
          docker run --rm --network none --memory 2g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e HOME=/tmp -e USER=scientist -e MPLCONFIGDIR=/tmp/mpl -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 active-science sh -eu -c '
            node --import tsx scripts/export-thermal-toolchain.ts
            /usr/bin/time -f "TS7 seconds=%e maxRSSKiB=%M" node node_modules/@typescript/native/bin/tsc --noEmit --checkers 1 2> science-evidence/typescript7.txt
            /usr/bin/time -f "TS6 seconds=%e maxRSSKiB=%M" node node_modules/typescript/bin/tsc6 --noEmit 2> science-evidence/typescript6.txt
            uv run --frozen --offline --no-sync --project scientific/active ruff format --diff scientific/active > science-evidence/ruff-format.patch || test "$?" = 1
            uv run --frozen --offline --no-sync --project scientific/active ruff check scientific/active --output-format concise
            uv run --frozen --offline --no-sync --project scientific/active python -m unittest discover -s scientific/active -p "test_*.py" -v
            uv run --frozen --offline --no-sync --project scientific/active python -m unittest discover -s scientific/public-data-campaign -p "test_*.py" -v
            uv run --frozen --offline --no-sync --project scientific/active snakemake --snakefile scientific/active/Snakefile --cores 1 --scheduler greedy
            uv run --frozen --offline --no-sync --project scientific/active snakemake --snakefile scientific/active/Snakefile --cores 1 --scheduler greedy
            uv run --frozen --offline --no-sync --project scientific/active python --version
            uv run --frozen --offline --no-sync --project scientific/active python scientific/active/thermal_reference.py science-evidence/thermal-live.json science-evidence/thermal-comparison.json
            uv pip freeze --python scientific/active/.venv/bin/python > science-evidence/runtime.txt
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: active-science-evidence
          path: |
            science-evidence/
            scientific/active/results/
          retention-days: 7
