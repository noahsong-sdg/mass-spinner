name: FEniCSx toolchain qualification
on:
  workflow_dispatch:
  push:
    branches: [codex/stack-modernization]
    paths: [ci/Dockerfile.fenicsx, scientific/current-fenicsx-reference/**, .github/workflows/fenicsx-qualification.yml]
permissions:
  contents: read
jobs:
  matched-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare pinned native environment
        run: |
          docker build -t fenicsx-current -f ci/Dockerfile.fenicsx .
          mkdir -p fenicsx-evidence
          docker image inspect fenicsx-current > fenicsx-evidence/container.json
      - name: Run unchanged matched-physics gates offline
        run: |
          docker run --rm --network none --memory 3g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e HOME=/tmp -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 fenicsx-current sh -eu -c '
            python3 -m pip freeze > fenicsx-evidence/runtime.txt
            python3 -m unittest discover -s scientific/current-fenicsx-reference -p test_reference.py -v > fenicsx-evidence/tests.log 2>&1
            python3 scientific/current-fenicsx-reference/reference.py fenicsx-evidence/comparison.json > fenicsx-evidence/refinement.log 2>&1
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fenicsx-evidence
          path: fenicsx-evidence/
          retention-days: 7
