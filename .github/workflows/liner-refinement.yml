name: Paired liner refinement
on:
  push:
    branches: [codex/liner-refinement-capture]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        grid: [4096,2048,1024]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare locked tools
        run: |
          docker build -t nested-check - <<'DOCKERFILE'
          FROM node:26.13.1-bookworm@sha256:b7087bc4d973034b30854b378ba107f9fab622b47514cb7e2592e41b8bab8d49
          DOCKERFILE
          docker run --rm --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp nested-check npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture one frozen gas grid offline
        env:
          GAS_GRID: '${{ matrix.grid }}'
        run: |
          docker run --rm --network none --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp nested-check node --import tsx scripts/probe-fuel-nested-coupling.ts capture --capture-grid "$GAS_GRID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: 'gas-${{ matrix.grid }}'
          path: capture/
          compression-level: 0
          if-no-files-found: error
  assess:
    needs: capture
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: gas-*
          path: captures
      - name: Prepare locked tools
        run: |
          docker build -t nested-check - <<'DOCKERFILE'
          FROM node:26.13.1-bookworm@sha256:b7087bc4d973034b30854b378ba107f9fab622b47514cb7e2592e41b8bab8d49
          RUN apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker run --rm --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp nested-check npm ci --ignore-scripts --no-audit --no-fund
      - name: Join, assess and independently authenticate offline
        run: |
          docker run --rm --network none --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --volume "$PWD:/work" --workdir /work --env HOME=/tmp nested-check sh -eu -c '
            node --import tsx --test tests/nested-capture-merge.test.ts tests/nested-heat-reuse.test.ts
            python3 scientific/spatial-argon-20261116/audit_nested.py --self-test
            node --import tsx scripts/merge-fuel-nested-captures.ts captures nested-output
            node --import tsx scripts/probe-fuel-nested-coupling.ts nested-output --assess-only
            python3 scientific/spatial-argon-20261116/audit_nested.py nested-output --source-root /work --output nested-output/independent-accounting.json
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: paired-liner-assessment
          path: |
            nested-output/index.json
            nested-output/assessment.json
            nested-output/independent-accounting.json
          if-no-files-found: error
