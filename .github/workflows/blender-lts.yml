name: Blender LTS qualification
on:
  workflow_dispatch:
  push:
    paths: [blender/**, web-assets/models/centrifuge-assembly.glb, web-assets/marathon-blanket-dimensions.json, ci/Dockerfile.blender, .github/workflows/blender-lts.yml]
  pull_request:
    paths: [blender/**, web-assets/models/centrifuge-assembly.glb, web-assets/marathon-blanket-dimensions.json, ci/Dockerfile.blender, .github/workflows/blender-lts.yml]
permissions:
  contents: read
jobs:
  assembly:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare checksum-pinned CPU render tools
        run: |
          docker build -t mass-spinner-blender -f ci/Dockerfile.blender .
          docker image inspect mass-spinner-blender --format '{{.Id}}'
      - name: Render and compare offline
        run: |
          mkdir -p output
          docker run --rm --network none --memory 3g --cpus 2 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e HOME=/tmp mass-spinner-blender sh -eu -c '
            python3 -m unittest discover -s blender -p "test_compare_assembly.py" -v
            python3 blender/render.py assembly output/blender-5.2.4
            python3 blender/compare_assembly.py web-assets/models/centrifuge-assembly.glb output/blender-5.2.4/centrifuge-assembly.glb
            /opt/blender/blender --background --factory-startup --threads 2 --python-exit-code 1 --python blender/build_gas_domain.py -- output/blender-5.2.4
            /opt/blender/blender --background --factory-startup --threads 2 --python-exit-code 1 --python blender/build_gas_markers.py -- output/blender-5.2.4
            /opt/blender/blender --background --factory-startup --threads 2 --python-exit-code 1 --python blender/build_paper_blanket.py -- output/blender-5.2.4
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: blender-lts-evidence
          path: output/blender-5.2.4/
          retention-days: 7
