name: Tutorial transition diagnostic
on:
  push:
    branches: [codex/legible-gas-modes]
    paths: [e2e/guide-bridge.spec.ts, .github/workflows/tutorial-transition-diagnostic.yml]
permissions:
  contents: read
  actions: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone]
    env:
      PLAYWRIGHT_PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # This diagnostic uses the unchanged d7b887c runtime. It is not a release gate.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-site
          path: release/
          run-id: 44843483283
          github-token: ${{ github.token }}
      - name: Check diagnostic identity
        run: |
          test "$(jq -r .sourceRevision release/release-manifest.json)" = d7b887c74cc8cf38e42fde84e269f5f4686d2fa9
          test "$(jq -r .lockSHA256 release/release-manifest.json)" = "$(sha256sum package-lock.json | cut -d ' ' -f 1)"
      - name: Prepare isolated Chromium
        run: |
          docker build -t mass-spinner-browser -f ci/Dockerfile.browser .
          docker run --rm --memory 1g --cpus 1 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e HOME=/tmp mass-spinner-browser npm ci --ignore-scripts --no-audit --no-fund
      - name: Profile the two failing paths
        run: |
          docker run --rm --network none --memory 2g --cpus 4 --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e HOME=/tmp -e PLAYWRIGHT_PROJECT mass-spinner-browser sh -eu -c 'npm run release:verify; npm run test:browser -- --project="$PLAYWRIGHT_PROJECT" --grep="an action used before|tutorial actions return"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: transition-diagnostic-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3
